<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050705">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SD Enigma">
  <meta name="build" content="v8">
  <link rel="manifest" href="./manifest.webmanifest?v=8">
  <title>Shattered Dragons: Enigma</title>
  <link rel="stylesheet" href="./styles.css?v=8">
</head>
<body>
  <main id="game" class="game" data-scene="camp">
    <div class="backdrop" aria-hidden="true"><img id="backdropImage" alt=""></div>

    <section class="scene-frame" aria-label="Game scene">
      <img id="sceneImage" class="scene-image" alt="" draggable="false">
      <div class="scene-vignette" aria-hidden="true"></div>
      <div id="hotspotLayer" class="hotspot-layer"></div>
    </section>

    <button id="hintBtn" class="hud-btn hint-button" type="button" aria-label="Hint">
      <span class="magnifier" aria-hidden="true"></span>
    </button>

    <button id="backBtn" class="hud-btn back-button" type="button" aria-label="Go back" hidden>
      <span class="back-chevron" aria-hidden="true"></span>
    </button>

    <button id="inventoryBtn" class="satchel-button" type="button" aria-label="Open satchel" aria-expanded="false">
      <span class="satchel" aria-hidden="true">
        <i class="satchel-handle"></i>
        <i class="satchel-body"></i>
        <i class="satchel-latch"></i>
      </span>
    </button>

    <aside id="inventoryTray" class="inventory-tray" aria-hidden="true">
      <div class="inventory-strip" aria-label="Satchel contents">
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
      </div>
    </aside>

    <div id="sceneToast" class="scene-toast" role="status" aria-live="polite"></div>
    <div id="hintToast" class="hint-toast" role="status" aria-live="polite"></div>

    <div id="assetError" class="asset-error" hidden role="alert">
      <strong>Scene image unavailable</strong>
      <span>The scene asset could not be decoded.</span>
    </div>

    <div id="echoLayer" class="echo-layer" aria-hidden="true"></div>
  </main>

  <script type="module" src="./app.js?v=8"></script>
</body>
</html>
