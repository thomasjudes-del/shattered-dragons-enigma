<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#020302">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SD Enigma">
  <meta name="build" content="v9.4">
  <link rel="stylesheet" href="./styles.css?v=94">
  <title>Shattered Dragons: Enigma</title>
</head>
<body>
  <main id="game" class="game" data-scene="camp" data-assets-ready="false">
    <section id="sceneFrame" class="scene-frame" aria-label="Game scene">
      <img id="sceneImage" class="scene-image" alt="" draggable="false">
      <div class="scene-vignette" aria-hidden="true"></div>
      <div id="hotspotLayer" class="hotspot-layer"></div>
    </section>

    <button id="hintBtn" class="hud-button hint-button" type="button" aria-label="Hint">
      <span class="magnifier" aria-hidden="true"></span>
    </button>

    <button id="backBtn" class="hud-button back-button" type="button" aria-label="Go back" hidden>
      <span class="back-chevron" aria-hidden="true"></span>
    </button>

    <button id="satchelBtn" class="satchel-button" type="button" aria-label="Open satchel" aria-expanded="false">
      <svg viewBox="0 0 120 110" aria-hidden="true">
        <defs>
          <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a7040"/><stop offset=".5" stop-color="#674324"/><stop offset="1" stop-color="#352116"/></linearGradient>
          <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#865c32"/><stop offset="1" stop-color="#51321d"/></linearGradient>
        </defs>
        <path d="M40 29v-8c0-11 8-17 20-17s20 6 20 17v8h-8v-7c0-7-4-10-12-10s-12 3-12 10v7z" fill="#442a19" stroke="#aa7b42" stroke-width="2"/>
        <rect x="14" y="25" width="92" height="76" rx="15" fill="url(#leather)" stroke="#b1844a" stroke-opacity=".68" stroke-width="2"/>
        <path d="M15 34c13 13 28 20 45 20s33-7 45-20v30c-13 9-28 14-45 14S28 73 15 64z" fill="url(#flap)" stroke="#b1844a" stroke-opacity=".58" stroke-width="1.5"/>
        <path d="M29 27v68M91 27v68" stroke="#3b2417" stroke-width="5"/><path d="M30 27v68M90 27v68" stroke="#9f6b38" stroke-width="1.4" opacity=".65"/>
        <rect x="53" y="58" width="14" height="18" rx="3" fill="#c8a259" stroke="#4b2d18" stroke-width="2"/>
      </svg>
    </button>

    <aside id="inventory" class="inventory" aria-hidden="true">
      <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
      <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
      <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
      <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
      <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
    </aside>

    <div id="hintToast" class="hint-toast" role="status" aria-live="polite"></div>
    <div id="errorBox" class="error-box" hidden role="alert"></div>
    <div id="echoLayer" class="echo-layer" aria-hidden="true"></div>
  </main>
  <script type="module" src="./app.js?v=94"></script>
</body>
</html>
