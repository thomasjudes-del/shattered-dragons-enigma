<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Shattered Dragons: Enigma</title>
  <link rel="stylesheet" href="./styles.css?v=185">
  <link rel="stylesheet" href="./game-v185.css?v=186">
</head>
<body>
  <main id="game" class="game" data-ready="false" data-scene="camp">
    <section class="stage" aria-label="Shattered Dragons Enigma scene">
      <img id="scene" class="scene" alt="" draggable="false">
      <div id="sceneProps" class="scene-props" aria-hidden="true"></div>
      <div id="hotspots" class="hotspots" aria-label="Interactive areas"></div>
      <div class="vignette" aria-hidden="true"></div>
      <button id="hint" class="round hint" type="button" aria-label="Hint"><span aria-hidden="true"></span></button>
      <button id="reset" class="reset" type="button" aria-label="Reset game">RESET</button>
      <button id="back" class="round back" type="button" aria-label="Back" hidden><i aria-hidden="true"></i></button>
      <div id="inventory" class="inventory" aria-hidden="true" aria-label="Inventory">
        <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
        <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
        <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
        <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
        <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
      </div>
      <div id="selectedItemLabel" class="selected-item-label" hidden></div>
      <button id="satchel" class="satchel" type="button" aria-label="Open satchel" aria-expanded="false">
        <img src="https://shattered-dragons-enigma.thomas-judes.workers.dev/assets/shattered-dragons/ui/satchel-v2.png" alt="" draggable="false">
      </button>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="echoes" class="echoes" aria-hidden="true"></div>
      <div id="loading" class="loading">Loading expedition...</div>
      <div id="errorBox" class="error-box" role="alert" hidden></div>
      <div id="modalLayer" class="modal-layer" aria-hidden="true" hidden>
        <article class="modal-card" role="dialog" aria-modal="true" aria-label="Game information">
          <button id="modalClose" class="modal-close" type="button" aria-label="Close">×</button>
          <div id="modalContent"></div>
        </article>
      </div>
    </section>
  </main>
  <script src="./app.js?v=185" defer></script>
</body>
</html>
