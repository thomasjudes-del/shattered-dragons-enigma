<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#060806">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SD Enigma">
  <meta name="build" content="v6.2">
  <link rel="manifest" href="./manifest.webmanifest?v=62">
  <title>Shattered Dragons: Enigma</title>
  <link rel="stylesheet" href="./styles.css?v=62">
</head>
<body>
  <main id="game" class="game" data-scene="camp">
    <div class="backdrop" aria-hidden="true">
      <img id="backdropImage" alt="">
    </div>

    <section class="scene-frame" aria-label="Game scene">
      <img id="sceneImage" class="scene-image" alt="" draggable="false">
      <div class="scene-vignette" aria-hidden="true"></div>
      <div id="hotspotLayer" class="hotspot-layer"></div>
    </section>

    <header class="topbar">
      <div class="brand" aria-label="Shattered Dragons Enigma Prologue">
        <strong>SHATTERED DRAGONS</strong>
        <span>ENIGMA · PROLOGUE</span>
      </div>
      <div class="top-actions">
        <button id="inventoryBtn" class="icon-btn inventory-button" type="button" aria-label="Open inventory" aria-expanded="false">
          <span class="inventory-glyph" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </button>
        <button id="hintBtn" class="icon-btn hint-button" type="button" aria-label="Hint">?</button>
      </div>
    </header>

    <div id="sceneToast" class="scene-toast" role="status" aria-live="polite"></div>
    <nav id="nav" class="nav" aria-label="Scene navigation"></nav>

    <div class="inventory-peek" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>

    <aside id="inventoryDrawer" class="inventory-drawer" aria-hidden="true">
      <div class="drawer-head">
        <div><small>FIELD KIT</small><strong>INVENTORY</strong></div>
        <button id="inventoryClose" class="drawer-close" type="button" aria-label="Close inventory">×</button>
      </div>
      <div class="inventory-grid" aria-label="Inventory slots">
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
        <button type="button" class="inventory-slot" aria-label="Empty slot"></button>
      </div>
      <p>Nothing collected yet.</p>
    </aside>

    <div id="hintToast" class="hint-toast" role="status" aria-live="polite"></div>

    <div id="assetError" class="asset-error" hidden role="alert">
      <strong>Scene image unavailable</strong>
      <span>This build failed its image decode step.</span>
    </div>

    <div id="echoLayer" class="echo-layer" aria-hidden="true"></div>
  </main>

  <script type="module" src="./app.js?v=62"></script>
</body>
</html>
