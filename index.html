<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Shattered Dragons: Enigma</title>
  <link rel="stylesheet" href="./styles.css?v=171">
</head>
<body>
  <main id="game" class="game" data-ready="false" data-scene="camp">
    <section class="stage" aria-label="Shattered Dragons Enigma scene">
      <img id="scene" class="scene" alt="" draggable="false">
      <div id="sceneProps" class="scene-props" aria-hidden="true"></div>
      <div id="hotspots" class="hotspots" aria-label="Interactive areas"></div>
      <div class="vignette" aria-hidden="true"></div>
      <button id="hint" class="round hint" type="button" aria-label="Hint"><span aria-hidden="true"></span></button>
      <button id="reset" class="reset" type="button" aria-label="Reset game" style="position:absolute;z-index:50;top:max(16px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));min-width:82px;height:42px;padding:0 14px;border:1px solid rgba(255,255,255,.8);border-radius:21px;background:rgba(0,0,0,.88);color:#fff;font:700 11px/1 system-ui,sans-serif;letter-spacing:.12em;box-shadow:0 4px 14px rgba(0,0,0,.5);" onclick="try{localStorage.removeItem('sde-inventory-v2');localStorage.removeItem('sde-inventory-v1')}catch(e){};window.location.href='./?v=171&reset=1'">RESET</button>
      <button id="back" class="round back" type="button" aria-label="Back" hidden><i aria-hidden="true"></i></button>
      <div id="inventory" class="inventory" aria-hidden="true" aria-label="Inventory">
        <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
        <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
        <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
        <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
        <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
      </div>
      <button id="satchel" class="satchel" type="button" aria-label="Open satchel" aria-expanded="false">
        <img src="./assets/clean/satchel.webp?v=171" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/thomasjudes-del/shattered-dragons-enigma/main/assets/clean/satchel.webp?v=171'" alt="" draggable="false">
      </button>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="echoes" class="echoes" aria-hidden="true"></div>
      <div id="loading" class="loading">Loading expedition...</div>
      <div id="errorBox" class="error-box" role="alert" hidden></div>
    </section>
  </main>
  <script src="./app.js?v=171" defer></script>
</body>
</html>
