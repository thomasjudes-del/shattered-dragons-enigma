<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#020302">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SD Enigma">
  <meta name="build" content="v9.3">
  <link rel="manifest" href="./manifest.webmanifest?v=93">
  <link rel="stylesheet" href="./styles.css?v=93">
  <title>Shattered Dragons: Enigma</title>
</head>
<body>
  <main id="game" class="game" data-scene="camp">
    <section id="sceneFrame" class="scene-frame" aria-label="Game scene">
      <img id="sceneImage" class="scene-image" alt="" draggable="false">
      <div class="scene-vignette" aria-hidden="true"></div>
      <div id="hotspotLayer" class="hotspot-layer"></div>
    </section>

    <button id="hintBtn" class="hud-button hint-button" type="button" aria-label="Hint">
      <span class="magnifier" aria-hidden="true"></span>
    </button>

    <button id="backBtn" class="hud-button back-button" type="button" aria-label="Go back" hidden>
      <span class="back-chevron" aria-hidden="true"></span>
    </button>

    <button id="satchelBtn" class="satchel-button" type="button" aria-label="Open satchel" aria-expanded="false">
      <svg viewBox="0 0 120 110" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="leather" x1="0" y1="0" x2="0.9" y2="1">
            <stop offset="0" stop-color="#8b6338"/>
            <stop offset="0.45" stop-color="#5e3e24"/>
            <stop offset="1" stop-color="#2f2017"/>
          </linearGradient>
          <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b98a4f" stop-opacity=".78"/>
            <stop offset="1" stop-color="#3b281a" stop-opacity=".4"/>
          </linearGradient>
          <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".55"/>
          </filter>
        </defs>
        <g filter="url(#shadow)">
          <path d="M39 28v-7c0-10 8-16 21-16s21 6 21 16v7h-8v-6c0-6-4-9-13-9s-13 3-13 9v6z" fill="#49301d" stroke="#a37945" stroke-width="2"/>
          <path d="M17 31c0-6 5-10 11-10h64c6 0 11 4 11 10v56c0 8-6 13-14 13H31c-8 0-14-5-14-13z" fill="url(#leather)" stroke="url(#edge)" stroke-width="2"/>
          <path d="M18 37c12 11 26 16 42 16s31-5 42-16v25c-12 8-26 12-42 12S30 70 18 62z" fill="#79502c" stroke="#a47742" stroke-width="1.5"/>
          <path d="M21 37c13 8 25 12 39 12s27-4 40-12" fill="none" stroke="#c49a61" stroke-opacity=".35" stroke-width="1.5"/>
          <rect x="54" y="57" width="12" height="16" rx="3" fill="#c2a05b" stroke="#4d321d" stroke-width="2"/>
          <path d="M30 27v67M90 27v67" stroke="#362318" stroke-width="5" opacity=".85"/>
          <path d="M30 29v64M90 29v64" stroke="#9d6d3d" stroke-width="1.4" opacity=".55"/>
          <circle cx="30" cy="46" r="2" fill="#d5b16b" opacity=".6"/>
          <circle cx="90" cy="46" r="2" fill="#d5b16b" opacity=".6"/>
        </g>
      </svg>
    </button>

    <aside id="inventory" class="inventory" aria-hidden="true">
      <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
      <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
      <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
      <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
      <button class="inventory-slot" type="button" aria-label="Empty slot"></button>
    </aside>

    <div id="hintToast" class="hint-toast" role="status" aria-live="polite"></div>
    <div id="errorBox" class="error-box" hidden role="alert"></div>
    <div id="echoLayer" class="echo-layer" aria-hidden="true"></div>
  </main>

  <script type="module" src="./app.js?v=93"></script>
</body>
</html>
