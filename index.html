<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07100a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SD Enigma">
  <link rel="manifest" href="./manifest.webmanifest?v=4">
  <title>Shattered Dragons: Enigma</title>
  <link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
  <main id="game" class="game" data-scene="camp">
    <div class="backdrop" aria-hidden="true"><img id="backdropImage" alt=""></div>
    <section id="scene" class="scene" aria-label="Game scene">
      <img id="sceneImage" class="scene-image" alt="" draggable="false">
      <div class="scene-vignette"></div>
      <div id="hotspots" class="hotspots"></div>
      <div id="echoLayer" class="echo-layer" aria-hidden="true"></div>
    </section>

    <header class="topbar">
      <div class="brand"><strong>SHATTERED DRAGONS</strong><span>ENIGMA · PROLOGUE</span></div>
      <div id="sceneLabel" class="scene-label">CAMP DE BASE</div>
    </header>

    <nav id="nav" class="nav" aria-label="Navigation"></nav>

    <footer class="hud">
      <button id="satchelButton" class="hud-button" type="button" aria-label="Open satchel" aria-expanded="false">
        <span class="bag-icon" aria-hidden="true"></span>
      </button>
      <div class="slots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <button id="hintButton" class="hud-button hint" type="button" aria-label="Hint">?</button>
    </footer>

    <aside id="satchel" class="satchel" aria-hidden="true">
      <div class="satchel-header"><span>SATCHEL</span><button id="satchelClose" type="button" aria-label="Close satchel">×</button></div>
      <div class="satchel-grid"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p>Nothing collected yet.</p>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="qaReport" hidden></div>
  </main>
  <script type="module" src="./app.js?v=4"></script>
</body>
</html>
