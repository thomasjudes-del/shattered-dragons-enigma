<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Shattered Dragons - Cloudinary Playground</title>
<style>
:root{color-scheme:dark;--ink:#f4f1ea;--muted:#9da7b2;--glass:rgba(8,12,16,.66);--line:rgba(255,255,255,.16);--accent:#8fd6be}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020405;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100dvh;overflow:hidden}.app{position:relative;height:100dvh;width:100vw;background:#020405}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transition:opacity .24s ease;user-select:none;-webkit-user-drag:none}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.48),transparent 28%,transparent 64%,rgba(0,0,0,.78));pointer-events:none}.top{position:absolute;z-index:4;left:0;right:0;top:0;padding:max(16px,env(safe-area-inset-top)) 18px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--glass);backdrop-filter:blur(10px)}.brand b{display:block;font-size:12px;letter-spacing:.12em}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.cloud{font-size:10px;color:var(--accent);padding:8px 10px;border-radius:999px;border:1px solid rgba(143,214,190,.36);background:rgba(8,18,16,.62);backdrop-filter:blur(10px)}.hud{position:absolute;z-index:4;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:grid;gap:10px}.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 14px;backdrop-filter:blur(12px)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font:600 18px/1.15 Georgia,serif}.hint{font-size:11px;color:var(--muted);margin-top:4px}.nav{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin-top:10px}.btn{height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(18,24,30,.82);color:var(--ink);font-size:22px}.btn:active{transform:scale(.98)}.dots{display:flex;justify-content:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}.dot.on{background:#fff;transform:scale(1.25)}.inventory{display:flex;align-items:center;gap:8px}.slot{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.3);display:grid;place-items:center;font-size:17px}.slot.filled{border-color:rgba(143,214,190,.45);color:var(--accent)}.hotspot{position:absolute;z-index:3;left:34%;top:30%;width:32%;height:36%;border:0;background:transparent;cursor:pointer}.pulse{position:absolute;z-index:2;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;border:1px solid rgba(255,255,255,.35);opacity:0;pointer-events:none}.pulse.show{animation:pulse .65s ease-out}@keyframes pulse{0%{opacity:.9;transform:scale(.35)}100%{opacity:0;transform:scale(1.7)}}.toast{position:absolute;z-index:5;left:50%;top:18%;transform:translateX(-50%);padding:9px 12px;border-radius:999px;background:rgba(3,7,9,.8);border:1px solid var(--line);font-size:11px;opacity:0;transition:opacity .18s;white-space:nowrap}.toast.show{opacity:1}@media(min-width:760px){.app{max-width:620px;margin:auto;border-left:1px solid #151a20;border-right:1px solid #151a20}.hud{left:20px;right:20px}.title{font-size:22px}}
</style>
</head>
<body>
<main class="app">
  <img id="scene" class="scene" alt="Shattered Dragons scene" />
  <div class="shade"></div>
  <button id="hotspot" class="hotspot" aria-label="Explore scene"></button>
  <div id="pulse" class="pulse"></div>
  <div id="toast" class="toast">Hotspot detected</div>
  <header class="top">
    <div class="brand"><b>SHATTERED DRAGONS</b><span>Cloudinary sandbox</span></div>
    <div class="cloud">LIVE CDN</div>
  </header>
  <section class="hud">
    <div class="panel">
      <div class="row">
        <div><div id="title" class="title"></div><div id="hint" class="hint"></div></div>
        <div class="inventory" aria-label="Inventory"><div id="slot1" class="slot">·</div><div class="slot">·</div></div>
      </div>
      <div class="nav">
        <button id="prev" class="btn" aria-label="Previous scene">‹</button>
        <div id="dots" class="dots" aria-hidden="true"></div>
        <button id="next" class="btn" aria-label="Next scene">›</button>
      </div>
    </div>
  </section>
</main>
<script>
const scenes=[
  {title:'Survey Camp',hint:'Tap the scene or move forward.',src:'https://res.cloudinary.com/u6hwxp4g/image/upload/v1787473311/camp.avif'},
  {title:'The Expedition',hint:'The route no longer matches the survey map.',src:'https://res.cloudinary.com/u6hwxp4g/image/upload/v1787473320/team.png'},
  {title:'Field Map',hint:'Tap the center to collect a field marker.',src:'https://res.cloudinary.com/u6hwxp4g/image/upload/v1787473328/map.png',collect:true},
  {title:'Buried Entrance',hint:'Something was built here long before the expedition.',src:'https://res.cloudinary.com/u6hwxp4g/image/upload/v1787473334/entrance.png'},
  {title:'Underground Lab',hint:'The complex continues deeper underground.',src:'https://res.cloudinary.com/u6hwxp4g/image/upload/v1787473343/lab.png'},
  {title:'Dragon Stasis Chamber',hint:'A living specimen is suspended beneath the buried complex.',src:'https://res.cloudinary.com/u6hwxp4g/image/upload/e_gen_restore/f_auto/q_auto:best/v1787475565/dragon-stasis-chamber.avif'},
  {title:'Breached Containment',hint:'Whatever escaped this chamber moved deeper into the complex.',src:'https://shattered-dragons-enigma.thomas-judes.workers.dev/assets/shattered-dragons/scene-07.png'}
];
let i=0, collected=false, timer;
const img=document.getElementById('scene'),title=document.getElementById('title'),hint=document.getElementById('hint'),dots=document.getElementById('dots'),slot1=document.getElementById('slot1'),toast=document.getElementById('toast'),pulse=document.getElementById('pulse');
function render(){const s=scenes[i];img.style.opacity='0';const probe=new Image();probe.onload=()=>{img.src=s.src;img.onload=()=>img.style.opacity='1'};probe.src=s.src;title.textContent=s.title;hint.textContent=s.hint;dots.innerHTML=scenes.map((_,n)=>`<span class="dot ${n===i?'on':''}"></span>`).join('');document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===scenes.length-1;}
function go(n){i=Math.max(0,Math.min(scenes.length-1,n));render()}
document.getElementById('prev').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('hotspot').onclick=e=>{pulse.style.left=e.clientX+'px';pulse.style.top=e.clientY+'px';pulse.classList.remove('show');void pulse.offsetWidth;pulse.classList.add('show');clearTimeout(timer);if(scenes[i].collect&&!collected){collected=true;slot1.textContent='◆';slot1.classList.add('filled');toast.textContent='Field marker added to inventory';}else{toast.textContent='Hotspot detected';}toast.classList.add('show');timer=setTimeout(()=>toast.classList.remove('show'),1100)};
render();
</script>
</body>
</html>
