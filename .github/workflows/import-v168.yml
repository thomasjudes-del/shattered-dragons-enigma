name: Import V168 assets

on:
  push:
    branches:
      - v168-map-state-assets
    paths:
      - assets/import-v168/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v168-map-state-assets
      - name: Rebuild and install V168 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat assets/import-v168/part*.b64 | base64 -d > /tmp/v168.tgz
          tar -xzf /tmp/v168.tgz -C .
          rm -rf assets/import-v168
          rm -f .github/workflows/import-v168.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html assets
          git add -u
          git commit -m "Implement persistent collectible scene objects and dedicated map inspection [skip ci]"
          git push origin HEAD:v168-map-state-assets
