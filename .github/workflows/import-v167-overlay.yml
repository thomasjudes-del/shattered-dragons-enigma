name: Import V167 overlay assets

on:
  push:
    branches: [v167-object-overlays]
    paths:
      - 'assets/import-v167-overlay/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild V167 overlay bundle
        run: |
          cat assets/import-v167-overlay/part*.b64 > /tmp/v167-overlay.b64
          base64 -d /tmp/v167-overlay.b64 > /tmp/v167-overlay.tgz
          tar -xzf /tmp/v167-overlay.tgz -C .
          rm -rf assets/import-v167-overlay
          rm -f .github/workflows/import-v167-overlay.yml
      - name: Commit V167 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement real pickup assets and dedicated map scene'
          git push
