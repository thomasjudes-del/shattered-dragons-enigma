name: Import HD scenes
on:
  push:
    branches: [hd-scenes-v0-ready-20260821]
    paths: [assets/import/READY]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd-scenes-v0-ready-20260821
      - name: Decode assets
        run: |
          set -euo pipefail
          mkdir -p assets/scenes
          for name in camp team map entrance lab; do
            cat assets/import/${name}.part*.b64 | tr -d '\n\r ' | base64 -d > assets/scenes/${name}-hd.avif
            test -s assets/scenes/${name}-hd.avif
          done
          file assets/scenes/*-hd.avif
      - name: Wire local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text()
          repl={
          'https://images.pexels.com/photos/6271505/pexels-photo-6271505.jpeg?auto=compress&cs=tinysrgb&w=2200':'./assets/scenes/camp-hd.avif',
          'https://images.unsplash.com/photo-1586957469525-7850e7bef283?auto=format&fit=crop&w=2200&q=88':'./assets/scenes/team-hd.avif',
          'https://images.pexels.com/photos/10595421/pexels-photo-10595421.jpeg?auto=compress&cs=tinysrgb&w=2200':'./assets/scenes/map-hd.avif',
          'https://images.pexels.com/photos/4520377/pexels-photo-4520377.jpeg?auto=compress&cs=tinysrgb&w=2200':'./assets/scenes/entrance-hd.avif',
          'https://images.pexels.com/photos/1411391/pexels-photo-1411391.jpeg?auto=compress&cs=tinysrgb&w=2200':'./assets/scenes/lab-hd.avif'}
          for a,b in repl.items():
              if a not in s: raise SystemExit('missing '+a)
              s=s.replace(a,b)
          p.write_text(s)
          p=Path('index.html'); s=p.read_text()
          s=s.replace('./styles.css?v=160','./styles.css?v=161').replace('./app.js?v=160','./app.js?v=161')
          s=s.replace('https://res.cloudinary.com/u6hwxp4g/image/upload/v1787259800/satchel-v0.webp','./assets/clean/satchel.webp')
          p.write_text(s)
          PY
      - name: Commit result
        run: |
          set -euo pipefail
          rm -rf assets/import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html assets/scenes
          git add -u
          git commit -m 'Use five HD project scenes from GitHub'
          git push origin HEAD:hd-scenes-v0-ready-20260821
