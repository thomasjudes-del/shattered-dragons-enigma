name: Import V168 assets

on:
  push:
    branches: [v168-final-clean]
    paths: ['assets/import-v168-clean/READY']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify V168 asset bundle
        run: |
          cat assets/import-v168-clean/part*.b64 > /tmp/v168.b64
          test "$(wc -c < /tmp/v168.b64)" -eq 190444
          echo '0d5c368076f0d2e05750f561966bb3e1afc38408058542b95f684ba301af7942  /tmp/v168.b64' | sha256sum -c -
          base64 -d /tmp/v168.b64 > /tmp/v168.tgz
          echo '5e1c9bdfbf3853a245bbd78f00d754b5d19e0c1cdf404e32289327667c88fdd8  /tmp/v168.tgz' | sha256sum -c -
          tar -xzf /tmp/v168.tgz -C .
          echo '1488653ea11dc7f662729454d0ffc645a5c6fc27b0757b7f522f70b84182cdf7  assets/scenes/map-table-base-hd.avif' | sha256sum -c -
          echo '34ae9ad2ad000e123749edf7781c699f7e6d807833443b4136876346b64e2bf7  assets/scenes/map-detail-hd.avif' | sha256sum -c -
          echo '06d583c848f83a6efa1d5947355c46bf26122f14a0374e5b57e348b3d19c51b6  assets/items/compass.webp' | sha256sum -c -
          echo '172d585526bbacb6be7beb68bd075b678902eb4d8968d5c568f1191fcc0dfa08  assets/items/flashlight.webp' | sha256sum -c -
      - name: Commit verified assets and clean temporary import files
        run: |
          rm -rf assets/import-v168-clean assets/import-v167-final3
          rm -f .github/workflows/import-v168-clean.yml .github/workflows/import-v167-final3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified V168 interaction assets [skip ci]'
          git push
