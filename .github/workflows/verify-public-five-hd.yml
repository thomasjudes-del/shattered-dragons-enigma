name: Verify public five-scene HD build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for GitHub Pages and verify the public build
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://thomasjudes-del.github.io/shattered-dragons-enigma'
          ok=0
          for attempt in $(seq 1 50); do
            echo "Public verification attempt $attempt"
            if curl -LfsS "$BASE/?verify=$GITHUB_SHA-$attempt" -o /tmp/index.html \
              && grep -q './app.js?v=164' /tmp/index.html \
              && curl -LfsS "$BASE/app.js?v=164&verify=$GITHUB_SHA-$attempt" -o /tmp/app.js \
              && grep -q './assets/scenes/team-hd.png?v=164' /tmp/app.js \
              && grep -q './assets/scenes/map-hd.png?v=164' /tmp/app.js \
              && grep -q './assets/scenes/entrance-hd.png?v=164' /tmp/app.js \
              && grep -q './assets/scenes/lab-hd.png?v=164' /tmp/app.js; then
              asset_ok=1
              for name in team map entrance lab; do
                if ! curl -LfsS "$BASE/assets/scenes/${name}-hd.png?verify=$GITHUB_SHA-$attempt" -o "/tmp/${name}.png"; then
                  asset_ok=0
                  break
                fi
              done
              if [ "$asset_ok" -eq 1 ] && python - <<'PY'
          from pathlib import Path
          import struct
          for name in ('team','map','entrance','lab'):
              p = Path(f'/tmp/{name}.png')
              data = p.read_bytes()[:24]
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{name}: bad PNG signature'
              wh = struct.unpack('>II', data[16:24])
              assert wh == (941, 1672), f'{name}: {wh}'
              print(name, wh, p.stat().st_size)
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Record successful public verification and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > PUBLIC_HD_VERIFIED.txt <<EOF
          GitHub Pages public verification succeeded.
          app.js cache version: 164
          camp: GitHub-hosted HD asset
          team: 941x1672 public PNG
          map: 941x1672 public PNG
          entrance: 941x1672 public PNG
          lab: 941x1672 public PNG
          EOF
          rm -f .github/workflows/verify-public-five-hd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record successful public HD verification [skip ci]'
          git push origin HEAD:main
