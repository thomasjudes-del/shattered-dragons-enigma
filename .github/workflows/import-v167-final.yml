name: Import V167 final assets

on:
  push:
    branches: [v167-final]
    paths:
      - 'assets/import-v167-final/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild V167 binary assets
        run: |
          cat assets/import-v167-final/bin*.b64 > /tmp/v167.b64
          base64 -d /tmp/v167.b64 > /tmp/v167.tgz
          tar -xzf /tmp/v167.tgz -C .
          rm -rf assets/import-v167-final
          rm -f .github/workflows/import-v167-final.yml
      - name: Commit V167 binary assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add V167 map and inventory assets'
          git push
