name: Materialize verified Camp HD fix

on:
  push:
    branches:
      - camp-hd-fix-20260821

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: camp-hd-fix-20260821
          fetch-depth: 0

      - name: Decode and verify Camp HD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/scenes
          cat \
            assets/import-camp-fix/camp.00.b64 \
            assets/import-camp-fix/camp.01.b64 \
            assets/import-camp-fix/camp.02.b64 \
            assets/import-camp-fix/camp.03.b64 \
            assets/import-camp-fix/camp.04.b64 \
            assets/import-camp-fix/camp.05.b64 \
            assets/import-camp-fix/camp.06.b64 \
            | tr -d '\n\r ' | base64 -d > assets/scenes/camp-hd.avif
          echo '9ee3ad88d446b6ce3e7e6e0f448a3d561db8617114d5ac20ad7e9a8437205406  assets/scenes/camp-hd.avif' | sha256sum -c -
          test "$(stat -c%s assets/scenes/camp-hd.avif)" -eq 99955

      - name: Switch Camp source only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          text = app.read_text()
          pattern = r"(id\s*:\s*['\"]camp['\"].*?\bsrc\s*:\s*)['\"][^'\"]+['\"]"
          text, n = re.subn(pattern, r"\1'./assets/scenes/camp-hd.avif?v=162'", text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Camp src replacement count: {n}')
          app.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html, n = re.subn(r'\./app\.js\?v=\d+', './app.js?v=162', html, count=1)
          if n != 1:
              raise SystemExit(f'app.js cache replacement count: {n}')
          index.write_text(html)
          PY

      - name: Cleanup transfer files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/import-camp-fix
          rm -f .github/workflows/materialize-camp-hd-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use verified GitHub-hosted HD camp scene [skip ci]'
          git push origin HEAD:camp-hd-fix-20260821
