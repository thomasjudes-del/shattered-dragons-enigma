name: Browser smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Test current code locally
        run: npm run test:e2e -- --project=desktop-chromium
      - name: Wait for GitHub Pages V167
        if: ${{ github.event_name == 'push' }}
        run: |
          for i in $(seq 1 30); do
            INDEX=$(curl -fsS "https://thomasjudes-del.github.io/shattered-dragons-enigma/?v=167" || true)
            APP=$(curl -fsS "https://thomasjudes-del.github.io/shattered-dragons-enigma/app.js?v=167" || true)
            if echo "$INDEX" | grep -q 'app.js?v=167' \
              && echo "$APP" | grep -q 'map-table-base-hd.avif' \
              && echo "$APP" | grep -q 'map-detail-hd.avif' \
              && curl -fsS -o /dev/null "https://thomasjudes-del.github.io/shattered-dragons-enigma/assets/scenes/map-table-base-hd.avif?v=167" \
              && curl -fsS -o /dev/null "https://thomasjudes-del.github.io/shattered-dragons-enigma/assets/scenes/map-detail-hd.avif?v=167" \
              && curl -fsS -o /dev/null "https://thomasjudes-del.github.io/shattered-dragons-enigma/assets/items/compass.webp?v=167" \
              && curl -fsS -o /dev/null "https://thomasjudes-del.github.io/shattered-dragons-enigma/assets/items/flashlight.webp?v=167"; then
              echo "GitHub Pages V167 is live with all interaction assets"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages V167 did not become ready in time"
          exit 1
      - name: Test real GitHub Pages interactions
        if: ${{ github.event_name == 'push' }}
        env:
          SDE_BASE_URL: https://thomasjudes-del.github.io/shattered-dragons-enigma/
        run: npm run test:e2e -- --project=desktop-chromium
      - name: Record verified public interaction build
        if: ${{ github.event_name == 'push' }}
        run: |
          printf 'GitHub Pages public interaction verification succeeded.\nversion: V167\nsource_commit: %s\nchecks: dedicated HD map scene; cup inert; flashlight and compass pickups disappear from table; real item images in satchel; persistence; entrance; lab; back navigation\n' "$GITHUB_SHA" > PUBLIC_INTERACTIONS_VERIFIED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_INTERACTIONS_VERIFIED.txt
          git commit -m 'Record public interaction verification [skip ci]'
          git push
      - name: Upload QA traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
