name: Materialize four HD scenes

on:
  push:
    branches:
      - four-hd-scenes-20260821

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEAM_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/f4974df2-daee-4996-b1fa-4664f4505873.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTkzNjY3NmZmNjg5NGQwOSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4NzUxMTAyM30.aD__YNWpKlKEiVrpL_bX2s6XJS0sM7HQv3LolWhtYhU"
      MAP_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/fc555160-4714-4c84-ac4f-34fc52a92c2e.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWVlYmI5OWEzODgyZjE5MSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4NzUxMzg4Mn0.CXzFVioe68Xcchv0rjcmiJuHeIFujmQYC3rmdcryNbE"
      ENTRANCE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/f9aa2f03-0a76-49d5-9ecf-857f34e91c53.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGNlOWVlNDQyOTUxYTU5NiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4NzU0NzIwNH0.eKplti0phORrmQlSo8YFegt7Wo8PRHtwH_H9uSDUBxc"
      LAB_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/ee0b5bf5-4ba3-4215-8d49-5784eed15c2f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMGQ0ZWJkYWMzMWNjNDEzYSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4NzUzNjE3Mn0.ysO6EgjcTs8IeklOP5g1o8jeqx_bFLCUbSQIVsZWR9o"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: four-hd-scenes-20260821
          fetch-depth: 0

      - name: Download the four original HD scenes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/scenes
          curl -L --fail --retry 3 "$TEAM_URL" -o assets/scenes/team-hd.png
          curl -L --fail --retry 3 "$MAP_URL" -o assets/scenes/map-hd.png
          curl -L --fail --retry 3 "$ENTRANCE_URL" -o assets/scenes/entrance-hd.png
          curl -L --fail --retry 3 "$LAB_URL" -o assets/scenes/lab-hd.png

      - name: Verify PNG dimensions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          for name in ('team','map','entrance','lab'):
              p = Path(f'assets/scenes/{name}-hd.png')
              data = p.read_bytes()[:24]
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{p}: not a PNG')
              w, h = struct.unpack('>II', data[16:24])
              print(p, w, h, p.stat().st_size)
              if (w, h) != (941, 1672):
                  raise SystemExit(f'{p}: unexpected dimensions {(w,h)}')
          PY

      - name: Point only the four remaining scenes to GitHub assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          text = app.read_text()
          for scene in ('team','map','entrance','lab'):
              pattern = rf"(id:'{scene}',\s*\n\s*src:)('[^']*')"
              repl = rf"\1'./assets/scenes/{scene}-hd.png?v=164'"
              text, n = re.subn(pattern, repl, text, count=1)
              if n != 1:
                  raise SystemExit(f'{scene} src replacement count: {n}')
          app.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html, n = re.subn(r'\./app\.js\?v=\d+', './app.js?v=164', html, count=1)
          if n != 1:
              raise SystemExit(f'app.js cache replacement count: {n}')
          index.write_text(html)
          PY

      - name: Remove temporary workflow and commit final change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-four-hd-scenes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use GitHub-hosted HD scenes 2-5 [skip ci]'
          git push origin HEAD:four-hd-scenes-20260821
