name: Probe V167 branch workflow

on:
  push:
    branches: [v167-final3]
    paths: ['assets/import-v167-final3/READY']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove workflow execution
        run: |
          printf 'workflow-ran\nsource=%s\n' "$GITHUB_SHA" > ACTION_WORKED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ACTION_WORKED.txt
          git commit -m 'Prove branch workflow execution [skip ci]'
          git push
