name: Import V167 final3 assets
on:
  push:
    branches: [v167-final3]
    paths: ['assets/import-v167-final3/READY']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat assets/import-v167-final3/bin*.b64 > /tmp/v167.b64
          base64 -d /tmp/v167.b64 > /tmp/v167.tgz
          tar -xzf /tmp/v167.tgz -C .
          rm -rf assets/import-v167-final3
          rm -f .github/workflows/import-v167-final3.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add V167 map and inventory assets'
          git push
